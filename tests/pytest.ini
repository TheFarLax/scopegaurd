[pytest]
# The gltest pytest plugin (for on-network integration tests) imports
# genlayer_py, which requires Python 3.12+ (collections.abc.Buffer). On this
# environment (Python 3.10) that import crashes pytest at startup, so we disable
# the plugin for the local logic suite. The on-network gltest suite must be run
# on a 3.12+ interpreter with a configured network (see tests/README.md).
addopts = -p no:gltest
testpaths = .
